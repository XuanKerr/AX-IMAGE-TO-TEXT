plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ax.imagetotext'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ax.imagetotext'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled Latin OCR model: works offline after installation.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.core:core:1.15.0'
}
